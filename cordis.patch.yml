# dsh-plugin-cli-hub Cordis patch layer
# Applied automatically by the framework when installed into a DSH profile; equivalent to
# inserting the cli-hub.core row at the top of the profile's bundle composition tree.
- insert:
    - id: cli-hub.core
      # Node-resolvable package name (must match package.json "name")
      name: dsh-plugin-cli-hub
      config:
        scan:
          defaultDepth: l3
          autoRefreshIntervalSec: 1800
          timeoutPerCmd: 3000
          showUnknown: true
        quota:
          cacheTtlSec: 300
          defaultWarningThresholdPercent: 10
        gateway:
          failureCooldownCount: 5
          failureCooldownSec: 30
          sandboxLevel: strict
        agent:
          singletonPerAdapter: true
