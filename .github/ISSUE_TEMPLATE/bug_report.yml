name: 🐛 Bug Report（错误报告）
description: "报告一个导致功能不正常、崩溃、或行为不符合 README 描述的问题。"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 bug！请尽量填完以下字段，越详细我们越快能定位。

  - type: checkboxes
    id: confirm-basic
    attributes:
      label: 基本确认
      options:
        - label: "我已尝试重新安装本插件：`dsh plugin remove dsh-plugin-cli-hub` + 重新 add"
          required: true
        - label: "我确认我的 DSH / dsh-plugin-cli-hub / Node.js 都是发布计划要求的版本（见下）"
          required: true
        - label: "我已看过 [Troubleshooting（README FAQ 章节）] 并确认问题不在那里"
          required: false

  - type: input
    id: plugin-version
    attributes:
      label: "dsh-plugin-cli-hub 版本"
      description: "例如 0.1.0。从 `cat ~/.dsh/profiles/<你的profile>/node_modules/dsh-plugin-cli-hub/package.json | grep version` 获取。"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: "DSH 版本"
      placeholder: "0.1.0-rc.8"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: "Node.js 版本"
      placeholder: "v20.14.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - "macOS arm64 (Apple Silicon)"
        - "macOS x64 (Intel)"
        - "Linux (x64)"
        - "Linux (arm64)"
        - "Windows (WSL2)"
        - "Windows (原生)"
        - "其他（请在下方说明）"
    validations:
      required: true

  - type: dropdown
    id: install-channel
    attributes:
      label: 安装方式
      description: "你是用哪种方式装的插件？"
      options:
        - "`dsh plugin add file:///path` （本地源码）"
        - "`dsh plugin add github:<user>/dsh-plugin-cli-hub` （GitHub）"
        - "`dsh plugin add npm:dsh-plugin-cli-hub` （npm）"
        - "通过 dsh-market 可视化插件商城"
        - "其他（如 scripts/install-to-dsh-web.sh）"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: "越具体越好，最好复制粘贴命令。"
      placeholder: |
        1. 执行 `dsh --profile web ...`
        2. 在 DSH 里说 "让 cli-hub 扫一下" ……
        3. 然后……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: "描述你预期应该发生什么。"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: "实际发生了什么？如果有错误提示请原封不动复制。"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: DSH 日志（关键片段）
      description: |
        请粘贴 `grep -nE '(cli-hub|ERROR|WARN)' <DSH 日志文件路径>` 的输出。
        不知道日志在哪？通常在：
          - macOS: `~/Library/Logs/dsh/` 或 `~/.dsh/profiles/<profile>/*.log`
          - Linux: `~/.dsh/profiles/<profile>/*.log`
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他可能相关的信息
      description: "例如：你本机装了多少 AI CLI、有没有特殊的 PATH 配置、用的是哪家的 shell (zsh/bash/fish)、是不是在 Docker 里跑等。"
