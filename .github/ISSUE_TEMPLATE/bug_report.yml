name: "🐛 Bug Report"
description: "Report something that malfunctions, crashes, or behaves differently from the README."
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Fill in as many fields below as you can — the more detail, the faster we can pinpoint it.

  - type: checkboxes
    id: confirm-basic
    attributes:
      label: Basic checks
      options:
        - label: "I tried reinstalling the plugin: `dsh plugin remove dsh-plugin-cli-hub` + re-add"
          required: true
        - label: "I confirm my DSH / dsh-plugin-cli-hub / Node.js versions meet the requirements (see below)"
          required: true
        - label: "I checked the Troubleshooting (README FAQ) section and confirmed my issue is not covered there"
          required: false

  - type: input
    id: plugin-version
    attributes:
      label: "dsh-plugin-cli-hub version"
      description: "e.g. 0.1.0. Get it via `cat ~/.dsh/profiles/<your-profile>/node_modules/dsh-plugin-cli-hub/package.json | grep version`."
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: "DSH version"
      placeholder: "0.1.0-rc.8"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: "Node.js version"
      placeholder: "v20.14.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - "macOS arm64 (Apple Silicon)"
        - "macOS x64 (Intel)"
        - "Linux (x64)"
        - "Linux (arm64)"
        - "Windows (WSL2)"
        - "Windows (native)"
        - "Other (explain below)"
    validations:
      required: true

  - type: dropdown
    id: install-channel
    attributes:
      label: Install channel
      description: "How did you install the plugin?"
      options:
        - "`dsh plugin add file:///path` (local source)"
        - "`dsh plugin add github:<user>/dsh-plugin-cli-hub` (GitHub)"
        - "`dsh plugin add npm:dsh-plugin-cli-hub` (npm)"
        - "Via the visual dsh-market plugin marketplace"
        - "Other (e.g. scripts/install-to-dsh-web.sh)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: "Be as specific as possible; paste commands verbatim."
      placeholder: |
        1. Run `dsh --profile web ...`
        2. Tell DSH "have cli-hub run a scan" ...
        3. Then ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "Describe what you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "What actually happened? Paste any error message verbatim."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: DSH logs (relevant excerpt)
      description: |
        Paste the output of `grep -nE '(cli-hub|ERROR|WARN)' <path to your DSH log file>`.
        Not sure where the logs are? Usually:
          - macOS: `~/Library/Logs/dsh/` or `~/.dsh/profiles/<profile>/*.log`
          - Linux: `~/.dsh/profiles/<profile>/*.log`
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Other possibly relevant information
      description: "e.g.: how many AI CLIs installed locally, any unusual PATH configuration, which shell you use (zsh/bash/fish), whether this runs inside Docker, etc."
