name: "✨ Feature Request"
description: "Propose a new feature, a new adapter, or an improvement to something existing."
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - "Add a new AI CLI adapter (category A: commercial cloud CLI)"
        - "Add a new AI CLI adapter (categories B-E: IDE / local / open-source / general)"
        - "Scanner: support a new scan source"
        - "QuotaManager: add native quota query for some CLI"
        - "Web UI improvement"
        - "New DSH CLI subcommand"
        - "Docs / README improvement"
        - "Other (describe in detail below)"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is your use case? Describe the problem or pain point
      description: "e.g.: I have the xx-ai CLI installed locally with quota, but cli-hub cannot discover / invoke it."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How would you like it solved?
      description: "Describe the ideal behavior. For a new adapter, provide the CLI website / GitHub URL."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you considered?
      description: "(Optional) Why do those alternatives not work?"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context / screenshots / reference links
      description: |
        e.g.: output of `xx --version`; official docs link; full text of `xx --help`;
        a Web UI screenshot showing where a button should go; etc. The more detail, the faster we ship.
    validations:
      required: false
