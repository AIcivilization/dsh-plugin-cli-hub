name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # DSH requires Node >= 18.18. v0.1.0 primarily validates 18 LTS / 20 LTS / 22 current.
        node-version: ['18.18.2', '20.x', '22.x']
        os: [ubuntu-latest, macos-14]     # macos-14 = arm64 M1, macos-13 = x64
        exclude:
          # keep 18/20/22 on Ubuntu and 20.x on macOS; skipping 18/22 on macOS keeps the matrix small to save CI time
          - os: macos-14
            node-version: '18.18.2'
          - os: macos-14
            node-version: '22.x'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node ${{ matrix.node-version }}
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (pnpm typecheck)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls dist/
          for f in dist/index.cjs dist/index.js dist/src/index.d.ts; do
            if [[ ! -e "$f" ]]; then
              echo "❌ missing artifact: $f"
              exit 1
            fi
          done
          echo "✅ build artifacts ok"

      - name: Lint
        run: pnpm lint || echo "\u26a0\ufe0f lint failed but not blocking (oxlint rules still being tuned during v0.1.0)"
        continue-on-error: true

      - name: Run unit tests
        run: pnpm test --run --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run e2e-smoke.mjs (non-DSH env; Scanner/Registry/Quota combined)
        shell: bash
        run: |
          set +e
          node scripts/e2e-smoke.mjs
          CODE=$?
          set -e
          if [[ $CODE -ne 0 ]]; then
            # e2e-smoke is sensitive to the environment (whether real AI CLIs exist); CI usually has none,
            # so as long as scanner / registry initialize successfully it does not count as a failure.
            # The script's own exit-code convention: 0 = all green; 1 = fatal; anything else = some CLIs not found.
            if [[ $CODE -eq 1 ]]; then
              echo "\u274c e2e-smoke fatal error (exit 1)"
              exit 1
            fi
            echo "\u2139\ufe0f e2e-smoke exited $CODE (this machine may have no AI CLIs); treated as non-fatal"
          fi

      - name: Dry-run npm pack (verify the tarball file list)
        shell: bash
        run: |
          set -euo pipefail
          PACK_OUT=$(pnpm pack --dry-run 2>&1) || true
          echo "$PACK_OUT"
          # key files that must be present
          for key in LICENSE README.md package.json dist/index.cjs dist/index.js; do
            if ! echo "$PACK_OUT" | grep -qF "$key"; then
              echo "\u274c tarball missing $key"
              exit 1
            fi
          done
          echo "\u2705 tarball key-file check ok"
