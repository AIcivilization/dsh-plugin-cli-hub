# dsh-plugin-cli-hub bundle definition (deprecated, kept for backward compatibility)
# Prefer loading via the dsh.bundle.patch -> cordis.patch.yml mechanism in package.json.
rows:
  - id: cli-hub.core
    use: dsh-plugin-cli-hub
    config:
      scan:
        defaultDepth: l3
        autoRefreshIntervalSec: 1800
        timeoutPerCmd: 3000
        showUnknown: true
      quota:
        cacheTtlSec: 300
        defaultWarningThresholdPercent: 10
      gateway:
        failureCooldownCount: 5
        failureCooldownSec: 30
        sandboxLevel: strict
      agent:
        singletonPerAdapter: true
